name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BOARD_MANIFEST: plugins/smartpowers/skills/smartpowers/board/Cargo.toml
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/smartpowers/skills/smartpowers/board

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check --manifest-path ${{ env.BOARD_MANIFEST }}

      - name: Clippy
        run: cargo clippy --all-targets --manifest-path ${{ env.BOARD_MANIFEST }} -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path ${{ env.BOARD_MANIFEST }}

      - name: Python tests
        run: python -m unittest discover -s tests -v
