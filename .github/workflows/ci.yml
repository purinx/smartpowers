name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BOARD_MANIFEST: plugins/smartpowers/skills/smartpowers/board/Cargo.toml
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/smartpowers/skills/smartpowers/board

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check --manifest-path ${{ env.BOARD_MANIFEST }}

      - name: Clippy
        run: cargo clippy --all-targets --manifest-path ${{ env.BOARD_MANIFEST }} -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path ${{ env.BOARD_MANIFEST }}

      - name: Shell tests
        shell: bash
        run: bash tests/run.sh

      - name: Release notes exist for the current version
        if: runner.os == 'Linux'
        run: scripts/release-notes.sh --current > /dev/null

  bootstrap:
    # The launcher must install a private Rust toolchain when cargo is absent.
    name: Launcher without Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Launch the board with Rust hidden (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '\.cargo/bin' | paste -sd: -)
          ! command -v cargo
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" SMARTPOWERS_RUST_HOME="$RUNNER_TEMP/rust" \
            plugins/smartpowers/skills/smartpowers/scripts/board --help
          test -x "$RUNNER_TEMP/rust/cargo/bin/cargo"
          test ! -e "$RUNNER_TEMP/home/.cargo"

      - name: Launch the board with Rust hidden (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch '\\\.cargo\\bin' }) -join ';'
          if (Get-Command cargo -ErrorAction SilentlyContinue) { throw 'cargo is still on PATH' }
          $env:USERPROFILE = "$env:RUNNER_TEMP\home"
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          $env:SMARTPOWERS_RUST_HOME = "$env:RUNNER_TEMP\rust"
          & plugins\smartpowers\skills\smartpowers\scripts\board.cmd --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:RUNNER_TEMP\rust\cargo\bin\cargo.exe")) { throw 'private toolchain missing' }
          if (Test-Path "$env:USERPROFILE\.cargo") { throw 'launcher wrote to ~/.cargo' }
